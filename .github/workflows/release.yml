name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate registry hash
        run: sha256sum bdoi_registry.json > registry.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bdoi_registry.json
            registry.sha256
            registry.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
